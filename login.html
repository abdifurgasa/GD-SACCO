<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - GD-SACCO</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Global & Page CSS -->
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/login.css" />
</head>
<body>

    <div class="login-wrapper">
        <!-- Background image (set via CSS) -->
        <div class="login-background"></div>

        <div class="login-card">
            <!-- Language Switcher (top-right corner) -->
            <div class="lang-switcher login-lang">
                <button class="lang-btn active" data-lang="en" title="English">EN</button>
                <button class="lang-btn" data-lang="am" title="አማርኛ">አማ</button>
                <button class="lang-btn" data-lang="om" title="Oromo">OM</button>
            </div>

            <!-- Branding -->
            <div class="login-brand">
                <div class="brand-icon">
                    <i class="fas fa-piggy-bank"></i>
                </div>
                <h1 data-i18n="brandTitle">GD-SACCO</h1>
                <p data-i18n="brandSub">Banking System</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        <span data-i18n="emailLabel">Email / Username</span>
                    </label>
                    <input type="email" id="email" placeholder="Enter your email" required />
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        <span data-i18n="passwordLabel">Password</span>
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required />
                        <button type="button" id="togglePassword" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" checked />
                        <span data-i18n="rememberMe">Remember me</span>
                    </label>
                    <a href="#" class="forgot-password" data-i18n="forgotPassword">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span data-i18n="signIn">Sign In</span>
                </button>

                <div class="login-footer">
                    <p>&copy; 2025 GD-SACCO. <span data-i18n="rights">All rights reserved.</span></p>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        // ---------- Multi-Language Translations ----------
        const translations = {
            en: {
                brandTitle: 'GD-SACCO',
                brandSub: 'Banking System',
                emailLabel: 'Email / Username',
                passwordLabel: 'Password',
                rememberMe: 'Remember me',
                forgotPassword: 'Forgot password?',
                signIn: 'Sign In',
                rights: 'All rights reserved.'
            },
            am: {
                brandTitle: 'ጂዲ-ሳኮ',
                brandSub: 'ባንክ ስርዓት',
                emailLabel: 'ኢሜል / የተጠቃሚ ስም',
                passwordLabel: 'የይለፍ ቃል',
                rememberMe: 'አስታውሰኝ',
                forgotPassword: 'የይለፍ ቃል ረሱ?',
                signIn: 'ግባ',
                rights: 'መብቶች በሙሉ ተጠብቀዋል።'
            },
            om: {
                brandTitle: 'GD-SACCO',
                brandSub: 'Sistema Baankii',
                emailLabel: 'Imeelii / Maqaa Fayyadamaa',
                passwordLabel: 'Jecha Iccitii',
                rememberMe: 'Na yaadadhu',
                forgotPassword: 'Jecha iccitii irranfatte?',
                signIn: 'Seeni',
                rights: 'Mirgi hundi eegama.'
            }
        };

        let currentLang = 'en';

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.textContent = t[key];
                }
            });
            // Update active button
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            // Save preference
            localStorage.setItem('sacco-lang', lang);
        }

        // Language switcher event listeners
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const lang = this.dataset.lang;
                setLanguage(lang);
            });
        });

        // Load saved language or default to browser language
        const savedLang = localStorage.getItem('sacco-lang') || navigator.language.split('-')[0];
        if (['en', 'am', 'om'].includes(savedLang)) {
            setLanguage(savedLang);
        } else {
            setLanguage('en');
        }

        // ---------- Toggle Password Visibility ----------
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // ---------- Login Form Submit ----------
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!email || !password) {
                alert('Please fill in both fields.');
                return;
            }
            // For demo: redirect to dashboard
            window.location.href = 'pages/dashboard.html';
        });
    </script>
</body>
</html>
