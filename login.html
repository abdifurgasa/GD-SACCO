<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GD-SACCO – Login</title>

    <!-- Google Fonts (CDN) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Font Awesome (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f2f5;
        }

        /* ===== BACKGROUND ===== */
        .login-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1563013544-824ae1b704d3?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            filter: brightness(0.6);
            z-index: 0;
        }

        /* ===== LOGIN CARD ===== */
        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 35px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== LANGUAGE SWITCHER ===== */
        .login-lang {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 10px;
        }
        .login-lang .lang-btn {
            background: transparent;
            border: 1px solid #d0d7d2;
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            color: #4a5a4e;
            transition: 0.2s;
        }
        .login-lang .lang-btn:hover { background: #eaf0ec; }
        .login-lang .lang-btn.active {
            background: #2d7a3d;
            color: #fff;
            border-color: #2d7a3d;
        }

        /* ===== BRANDING ===== */
        .login-brand {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand-icon {
            font-size: 48px;
            color: #2d7a3d;
            background: rgba(45, 122, 61, 0.1);
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            margin: 0 auto 12px;
        }
        .login-brand h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a2e1f;
            margin-bottom: 4px;
        }
        .login-brand p {
            color: #5a6b5d;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* ===== FORM ===== */
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-weight: 500;
            color: #2d3a31;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .form-group label i { margin-right: 8px; color: #2d7a3d; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d0d7d2;
            border-radius: 12px;
            font-size: 15px;
            background: #f9fbf9;
            transition: 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2d7a3d;
            box-shadow: 0 0 0 3px rgba(45, 122, 61, 0.15);
        }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 46px; }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #7a8a7e;
            cursor: pointer;
            font-size: 18px;
        }
        .toggle-password:hover { color: #2d7a3d; }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 24px;
            font-size: 14px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #3d4d42;
            cursor: pointer;
        }
        .remember-me input { accent-color: #2d7a3d; }
        .forgot-password {
            color: #2d7a3d;
            font-weight: 500;
            text-decoration: none;
        }
        .forgot-password:hover { text-decoration: underline; }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #2d7a3d;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .login-btn:hover {
            background: #1f5e2c;
            transform: scale(1.02);
        }
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .login-footer {
            margin-top: 20px;
            text-align: center;
            color: #6c7d70;
            font-size: 13px;
            border-top: 1px solid #e8ede9;
            padding-top: 18px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-card { padding: 30px 20px; margin: 0 16px; }
            .login-brand h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-background"></div>
        <div class="login-card">
            <!-- Language Switcher -->
            <div class="login-lang">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="am">አማ</button>
                <button class="lang-btn" data-lang="om">OM</button>
            </div>

            <!-- Brand -->
            <div class="login-brand">
                <div class="brand-icon"><i class="fas fa-piggy-bank"></i></div>
                <h1 data-i18n="brandTitle">GD-SACCO</h1>
                <p data-i18n="brandSub">Banking System</p>
            </div>

            <!-- Form -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> <span data-i18n="emailLabel">Email / Username</span></label>
                    <input type="email" id="email" placeholder="Enter your email" required />
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> <span data-i18n="passwordLabel">Password</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required />
                        <button type="button" id="togglePassword" class="toggle-password"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember-me"><input type="checkbox" checked /> <span data-i18n="rememberMe">Remember me</span></label>
                    <a href="#" class="forgot-password" data-i18n="forgotPassword">Forgot password?</a>
                </div>
                <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> <span data-i18n="signIn">Sign In</span></button>
                <div class="login-footer">
                    <p>&copy; 2025 GD-SACCO. <span data-i18n="rights">All rights reserved.</span></p>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== FIREBASE + AUTH + LANGUAGE (inline) ===== -->
    <!-- 1) Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ==========================================================
        // 1) FIREBASE CONFIG
        // ==========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAZr7z4pFWnEdZGkcWhHkCgelhKFHY6Iuo",
            authDomain: "gd-sacco.firebaseapp.com",
            projectId: "gd-sacco",
            storageBucket: "gd-sacco.firebasestorage.app",
            messagingSenderId: "753510020841",
            appId: "1:753510020841:web:801f39cdaf183e5b43e278",
            measurementId: "G-W06351EVFV"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ==========================================================
        // 2) AUTH FUNCTIONS
        // ==========================================================
        async function loginUser(email, password) {
            try {
                const cred = await auth.signInWithEmailAndPassword(email, password);
                return { success: true, user: cred.user };
            } catch (error) {
                let msg = 'Login failed.';
                switch (error.code) {
                    case 'auth/user-not-found': msg = 'No account found.'; break;
                    case 'auth/wrong-password': msg = 'Incorrect password.'; break;
                    case 'auth/invalid-email': msg = 'Invalid email.'; break;
                    case 'auth/too-many-requests': msg = 'Too many attempts. Try later.'; break;
                    default: msg = error.message;
                }
                return { success: false, message: msg };
            }
        }

        function redirectIfLoggedIn() {
            if (auth.currentUser) {
                window.location.href = 'pages/dashboard.html';
                return true;
            }
            return false;
        }

        // ==========================================================
        // 3) MULTI-LANGUAGE
        // ==========================================================
        const translations = {
            en: {
                brandTitle: 'GD-SACCO',
                brandSub: 'Banking System',
                emailLabel: 'Email / Username',
                passwordLabel: 'Password',
                rememberMe: 'Remember me',
                forgotPassword: 'Forgot password?',
                signIn: 'Sign In',
                rights: 'All rights reserved.'
            },
            am: {
                brandTitle: 'ጂዲ-ሳኮ',
                brandSub: 'ባንክ ስርዓት',
                emailLabel: 'ኢሜል / የተጠቃሚ ስም',
                passwordLabel: 'የይለፍ ቃል',
                rememberMe: 'አስታውሰኝ',
                forgotPassword: 'የይለፍ ቃል ረሱ?',
                signIn: 'ግባ',
                rights: 'መብቶች በሙሉ ተጠብቀዋል።'
            },
            om: {
                brandTitle: 'GD-SACCO',
                brandSub: 'Sistema Baankii',
                emailLabel: 'Imeelii / Maqaa Fayyadamaa',
                passwordLabel: 'Jecha Iccitii',
                rememberMe: 'Na yaadadhu',
                forgotPassword: 'Jecha iccitii irranfatte?',
                signIn: 'Seeni',
                rights: 'Mirgi hundi eegama.'
            }
        };

        function setLanguage(lang) {
            const t = translations[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = t[key];
                    } else {
                        el.innerHTML = t[key];
                    }
                }
            });
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            localStorage.setItem('sacco-lang', lang);
        }

        function initLanguage() {
            const saved = localStorage.getItem('sacco-lang') || navigator.language.split('-')[0];
            const valid = ['en','am','om'];
            setLanguage(valid.includes(saved) ? saved : 'en');
        }

        // ==========================================================
        // 4) DOM READY
        // ==========================================================
        document.addEventListener('DOMContentLoaded', function() {
            // -- Language --
            initLanguage();
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    setLanguage(this.dataset.lang);
                });
            });

            // -- Redirect if already logged in --
            if (redirectIfLoggedIn()) return;

            // -- Login form --
            const form = document.getElementById('loginForm');
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            const btn = form.querySelector('.login-btn');
            const originalText = btn.innerHTML;

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const emailVal = email.value.trim();
                const passVal = password.value.trim();
                if (!emailVal || !passVal) {
                    alert('Please fill in both fields.');
                    return;
                }
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

                const result = await loginUser(emailVal, passVal);
                if (result.success) {
                    window.location.href = 'pages/dashboard.html';
                } else {
                    alert('Login failed: ' + result.message);
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    password.value = '';
                    password.focus();
                }
            });

            // -- Toggle password --
            document.getElementById('togglePassword').addEventListener('click', function() {
                const icon = this.querySelector('i');
                if (password.type === 'password') {
                    password.type = 'text';
                    icon.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    password.type = 'password';
                    icon.classList.replace('fa-eye-slash', 'fa-eye');
                }
            });
        });
    </script>
</body>
</html>
