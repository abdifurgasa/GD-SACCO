<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GD-SACCO – Login</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Global & Page CSS -->
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/login.css" />
</head>
<body>

    <div class="login-wrapper">
        <!-- Background image -->
        <div class="login-background"></div>

        <div class="login-card">
            <!-- Language Switcher -->
            <div class="lang-switcher login-lang">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="am">አማ</button>
                <button class="lang-btn" data-lang="om">OM</button>
            </div>

            <!-- Branding -->
            <div class="login-brand">
                <div class="brand-icon"><i class="fas fa-piggy-bank"></i></div>
                <h1 data-i18n="brandTitle">GD-SACCO</h1>
                <p data-i18n="brandSub">Banking System</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        <span data-i18n="emailLabel">Email / Username</span>
                    </label>
                    <input type="email" id="email" placeholder="Enter your email" required />
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        <span data-i18n="passwordLabel">Password</span>
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required />
                        <button type="button" id="togglePassword" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" checked />
                        <span data-i18n="rememberMe">Remember me</span>
                    </label>
                    <a href="#" class="forgot-password" data-i18n="forgotPassword">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span data-i18n="signIn">Sign In</span>
                </button>

                <div class="login-footer">
                    <p>&copy; 2025 GD-SACCO. <span data-i18n="rights">All rights reserved.</span></p>
                </div>
            </form>
        </div>
    </div>

    <!-- ========================================================== -->
    <!-- SCRIPTS – Firebase + Auth + Login + Language              -->
    <!-- ========================================================== -->

    <!-- 1) Firebase Compat SDKs (v10.7.1 works with your config) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- 2) Firebase Config -->
    <script src="assets/js/firebase-config.js"></script>

    <!-- 3) Auth Handlers -->
    <script src="assets/js/auth.js"></script>

    <!-- 4) Login Page Logic -->
    <script src="assets/js/login.js"></script>

    <!-- 5) Multi‑language (standalone utility) -->
    <script src="assets/js/language.js"></script>

    <!-- 6) Initialize language on page load -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof window.initLanguage === 'function') {
                window.initLanguage();
            }
            // Redirect if already logged in
            if (typeof window.redirectIfLoggedIn === 'function') {
                window.redirectIfLoggedIn('pages/dashboard.html');
            }
        });
    </script>
</body>
</html>
